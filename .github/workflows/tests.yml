name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # sqlite3 (dépendance de test) exige Node >= 20.17
        node-version: [ 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Les migrations doivent s'appliquer et se dérouler dans les deux sens
      - name: Apply migrations
        run: npx sequelize-cli db:migrate
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: ./ci.sqlite

      - name: Roll back migrations
        run: npx sequelize-cli db:migrate:undo:all
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: ./ci.sqlite
